<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hexagon Background -->
  <polygon points="256,16 456,131 456,361 256,476 56,361 56,131" fill="url(#goldGrad)" rx="20" ry="20" filter="url(#shadow)" />
  
  <!-- Inner Hexagon Accent -->
  <polygon points="256,36 436,140 436,352 256,456 76,352 76,140" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3"/>

  <!-- Leaf Accent -->
  <path d="M 256 100 C 340 100, 400 170, 390 260 C 370 200, 320 160, 256 160 C 192 160, 142 200, 122 260 C 112 170, 172 100, 256 100 Z" fill="url(#greenGrad)" opacity="0.9" />

  <!-- Bee Body & Wings Vector -->
  <!-- Wings Left & Right -->
  <ellipse cx="190" cy="220" rx="45" ry="70" transform="rotate(-35 190 220)" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="322" cy="220" rx="45" ry="70" transform="rotate(35 322 220)" fill="#ffffff" opacity="0.85"/>
  
  <!-- Bee Abdomen & Head -->
  <ellipse cx="256" cy="300" rx="65" ry="85" fill="#1e293b"/>
  <!-- Gold Stripes -->
  <path d="M 198 275 A 65 85 0 0 0 314 275 A 65 85 0 0 1 198 275 Z" fill="#fbbf24"/>
  <path d="M 194 310 A 65 85 0 0 0 318 310 A 65 85 0 0 1 194 310 Z" fill="#fbbf24"/>
  <path d="M 205 345 A 65 85 0 0 0 307 345 A 65 85 0 0 1 205 345 Z" fill="#fbbf24"/>
  
  <!-- Head -->
  <circle cx="256" cy="205" r="42" fill="#1e293b"/>
  <!-- Eyes -->
  <circle cx="238" cy="195" r="8" fill="#fbbf24"/>
  <circle cx="274" cy="195" r="8" fill="#fbbf24"/>

  <!-- Antennae -->
  <path d="M 242 168 Q 230 140 215 145" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <path d="M 270 168 Q 282 140 297 145" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
</svg>
